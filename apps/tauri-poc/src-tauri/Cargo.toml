[package]
name = "apexbot-tauri-poc"
version = "0.1.0"
edition = "2021"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
apexbot-tauri-feed-model = { path = "../feed-model" }
apexbot = { path = "../../../rust/crates/facade/apexbot" }
apexbot-ingestion = { path = "../../../rust/crates/foundation/apexbot-ingestion" }
futures-util = { version = "0.3", features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tokio = { version = "1", features = ["rt", "time", "macros"] }
