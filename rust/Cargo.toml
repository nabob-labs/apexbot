# apexbot Rust workspace — pure virtual manifest.
#
# The workspace root holds ONLY the `[workspace]` declaration + the `[profile.*]`
# blocks (Cargo only honors `[profile]` at the workspace root — keep them here).
# The workspace contains 31 crates, a non-publishable stub generator
# (rust/tools/stubgen), and two non-publishable examples. Crates are
# explicitly grouped by architectural role under
# `crates/{foundation,engine,integrations,shells,facade}/`; examples live under
# `examples/`. The Python binding is a shell beside the Rust-facing core rather
# than an implementation peer.
#
# Engine and foundation crates are pyo3-free under their default features;
# `apexbot_rs` enables selected crates' `pyo3` features so the
# `From<Error> for PyErr` conversions are available at the binding layer. Verify
# with `just check-no-pyo3-in-cores`.

# Shared package metadata inherited by every member crate via `<field>.workspace
# = true` (ADR-009 single-source-of-truth versioning). The version literal here
# is the *only* version in the Rust tree; the binding crate `apexbot_rs`
# (`crates/shells/apexbot-python/`) inherits it, and maturin reads that crate's
# version to set the published wheel's — so one edit moves both halves.
[workspace.package]
version = "0.6.0-alpha.17"
edition = "2021"
license = "MIT"
rust-version = "1.97"
repository = "https://github.com/nabob-labs/apexbot"
authors = ["nabob-labs <astralmoonhalo@gmail.com.com>"]

# Single source of truth for lint policy across all workspace members
# (ADR: centralize per-crate [lints] duplication). Every member inherits these
# via `[lints] workspace = true`, so adjusting a clippy group or adding a lint
# is a one-line edit here instead of a per-crate sweep. This is the in-tree
# POLICY; the push gate's `cargo clippy -- --deny warnings` is what escalates
# the warn-level groups to hard failure at push/CI time.
#
# The open-ended `warnings` group is deliberately NOT denied here: it would bind
# every toolchain to the lint surface of whichever vintage compiled the tree, so
# a lint the reference toolchain never had would fail compliant contributors.
# Escalation belongs to the strict tier's verdict (the reference channel - see
# scripts/toolchain_tier.sh); the named denies below stay hard everywhere.
[workspace.lints.rust]
# cargo-llvm-cov builds set --cfg coverage and the instrumented tests carry
# #[cfg_attr(coverage, ignore)] for timing-sensitive pins; declare the name so
# default (non-instrumented) builds accept the attribute instead of
# erroring on an unknown cfg. `tokio_unstable` is supplied per-build via RUSTFLAGS
# on the hotpath lanes (apexbot-bot / the apexbot-pools `solve` tree carry a `compile_error!`
# guard so a hotpath build without it fails loudly instead of silently dropping
# the tokio RuntimeMetrics).
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(coverage, values(none()))', 'cfg(tokio_unstable)'] }

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
correctness = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
suspicious = { level = "warn", priority = -1 }

# Panic safety - must handle errors, not crash
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
panic_in_result_fn = "deny"

# The "no cheating" rule
# NOTE: allow_attributes_without_reason would ALSO demand a reason on every #[expect]
# (882 expects, only 19 reasoned) - too costly. keep allow_attributes (outer) + a CI rg guard for inner #![allow].
allow_attributes = "deny"

# Async hygiene - a future bound to `let _ =` is dropped on the spot and never runs,
# so the async body never executes (the cancelling-async talk's opening example).
# Rust cannot backstop this with unused_must_use: most futures are not #[must_use].
let_underscore_future = "deny"

# Code hygiene - no debug leftovers
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

# Prevents deadlocks
await_holding_lock = "deny"

# Libraries shouldn't exit
exit = "deny"

[workspace.dependencies]
apexbot = { version = "0.6.0-alpha.17", path = "crates/facade/apexbot" }
# Internal path deps carry explicit version requirements here so the 30
# publishable crates pass cargo publish manifest validation. Keep these
# version literals in sync with [workspace.package].version (lockstep, ADR-009).
apexbot-aave = { version = "0.6.0-alpha.17", path = "crates/integrations/apexbot-aave" }
apexbot-abi = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-abi" }
apexbot-batch-executor = { version = "0.6.0-alpha.17", path = "crates/engine/apexbot-batch-executor" }
apexbot-arbitrage = { version = "0.6.0-alpha.17", path = "crates/engine/apexbot-arbitrage" }
apexbot-bot = { version = "0.6.0-alpha.17", path = "crates/engine/apexbot-bot" }
apexbot-cli = { version = "0.6.0-alpha.17", path = "crates/shells/apexbot-cli" }
apexbot-cli-core = { version = "0.6.0-alpha.17", path = "crates/shells/apexbot-cli-core" }
apexbot-core = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-core" }
apexbot-config = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-config" }
apexbot-db = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-db" }
apexbot-decoders = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-decoders" }
apexbot-execution = { version = "0.6.0-alpha.17", path = "crates/engine/apexbot-execution" }
apexbot-executor = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-executor" }
apexbot-eventhub = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-eventhub" }
apexbot-fork = { version = "0.6.0-alpha.17", path = "crates/integrations/apexbot-fork" }
apexbot-ingestion = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-ingestion" }
apexbot-math = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-math" }
apexbot-order-index = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-order-index" }
apexbot-pathfinding = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-pathfinding" }
apexbot-pool-updater = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-pool-updater" }
apexbot-pools = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-pools" }
apexbot-price = { version = "0.6.0-alpha.17", path = "crates/integrations/apexbot-price" }
apexbot-rpc = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-rpc" }
apexbot-runs = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-runs" }
apexbot-simulation = { version = "0.6.0-alpha.17", path = "crates/engine/apexbot-simulation" }
apexbot-strategy = { version = "0.6.0-alpha.17", path = "crates/engine/apexbot-strategy" }
apexbot-submission = { version = "0.6.0-alpha.17", path = "crates/engine/apexbot-submission" }
apexbot-substrate = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-substrate" }
apexbot-uniswap = { version = "0.6.0-alpha.17", path = "crates/foundation/apexbot-uniswap" }
apexbot-workers = { version = "0.6.0-alpha.17", path = "crates/engine/apexbot-workers" }
# hashbrown: foldhash-based HashMap/HashSet for the hot maps (small int/string
# keys generated in-process — no DoS surface). 0.17.1 + foldhash 0.2.0 already
# resolve transitively (indexmap 2.14 / lru 0.18), so this direct dependency
# unifies the graph instead of growing it. default-hasher = foldhash.
hashbrown = { version = "0.17", features = ["default-hasher"] }
# indexmap: insertion-ordered set/map. `IndexSet` is the recency ledger's bucket
# set — hashbrown offers no ordered variant, and the
# ledger needs order-preserving mutation: `shift_remove` on promotion, a
# `split_off` head/tail split on a partial drain, and `mem::take` for a
# whole-bucket drain. 2.14.2 already resolves transitively (alloy et al.), so
# this direct dep unifies the graph rather than growing it.
indexmap = "2"
# zstd: decode-only use for the committed .jsonl.zst capture fixtures
# (apexbot-pools/src/solve/capture_fixture.rs). arrays avoids building the
# legacy/mt C code paths we never touch.
zstd = { version = "0.14", default-features = false, features = ["arrays"] }

[workspace]
resolver = "3"
members = [
    "crates/facade/apexbot",
    "crates/foundation/apexbot-abi",
    "crates/foundation/apexbot-config",
    "crates/foundation/apexbot-core",
    "crates/foundation/apexbot-db",
    "crates/foundation/apexbot-decoders",
    "crates/foundation/apexbot-eventhub",
    "crates/foundation/apexbot-executor",
    "crates/foundation/apexbot-math",
    "crates/foundation/apexbot-order-index",
    "crates/foundation/apexbot-pathfinding",
    "crates/foundation/apexbot-pools",
    "crates/foundation/apexbot-substrate",
    "crates/foundation/apexbot-rpc",
    "crates/foundation/apexbot-uniswap",
    "crates/engine/apexbot-arbitrage",
    "crates/engine/apexbot-batch-executor",
    "crates/engine/apexbot-bot",
    "crates/engine/apexbot-execution",
    "crates/engine/apexbot-simulation",
    "crates/engine/apexbot-strategy",
    "crates/engine/apexbot-submission",
    "crates/engine/apexbot-workers",
    "crates/integrations/apexbot-aave",
    "crates/integrations/apexbot-fork",
    "crates/integrations/apexbot-price",
    # ADR-084 D4: transport/IO the stack depends on is foundation — ingestion,
    # runs, and pool-updater moved out of integrations (W4).
    "crates/foundation/apexbot-ingestion",
    "crates/foundation/apexbot-pool-updater",
    "crates/foundation/apexbot-runs",
    "crates/shells/apexbot-cli",
    "crates/shells/apexbot-cli-core",
    "crates/shells/apexbot-python",
    # Non-publishable samples + the ADR-066 stub generator live outside the
    # role-grouped product crates.
    "examples/apexbot-execution-sample",
    # The external umbrella-consumer example depends through `apexbot` like an
    # out-of-workspace `cargo add apexbot` user.
    "examples/settlement_bot",
    "tools/stubgen",
]
# Keep unqualified Cargo commands focused on the two first-class pure-Rust
# entry points. The PyO3 binding and non-publishable samples remain workspace
# members, but dedicated recipes must select them explicitly.
default-members = [
    "crates/facade/apexbot",
    "crates/shells/apexbot-cli",
]

# Release profile.
#
# IMPORTANT framing for the two first-class consumers (see AGENTS.md): Cargo
# only honors `[profile.*]` from the top-level package being built — profile
# settings in the manifests of *dependencies* are ignored entirely. So every
# block below tunes ONLY apexbot's own in-repo builds (the `apexbot_rs`
# cdylib and in-workspace `cargo test`/`clippy`).
#
# The pure-Rust consumer (`cargo add apexbot`, building the umbrella crate
# into their own binary — see `examples/standalone_consumer.rs`) is entirely
# unaffected: their build reads *their* workspace's `[profile.release]`, which
# applies uniformly across the whole dependency graph including these crates.
# Their binary's LTO/codegen is theirs to own, not this file's.
#
# Within this workspace, the only shipped runtime artifact is the `apexbot_rs`
# cdylib (the Python extension, built from `crates/shells/apexbot-python`), and it
# gets the heavy optimizations — `lto = "thin"` + `strip` + `codegen-units = 1`.
# `lto`/`strip` are profile-level (Cargo has no per-package `lto`), so they
# apply workspace-wide, but the final thin-LTO link only spans codegen units
# that survive into the cdylib.
#
# The pure-Rust core crates (`apexbot-core`, `-concentrated-liquidity-math`, `-abi`, `-rpc`,
# `-bot`) get per-package overrides below: more `codegen-units` for faster
# compilation during a cdylib release build. They are libraries consumed (and
# inlined at the final link) by the cdylib, so the looser per-package codegen
# does not meaningfully hurt runtime — the cdylib's thin LTO re-converges.
#
# If a Rust bot is ever shipped as a *binary built inside this workspace* (no
# `[[bin]]` target exists today — all members are libraries), revisit this:
# the per-package loosening and the cdylib-singular framing would then apply
# to that second shipped artifact. Downstream consumers building it from the
# umbrella are unaffected regardless.
[profile.release]
lto = "thin"
strip = true
codegen-units = 1

[profile.release.package.apexbot-core]
codegen-units = 16
[profile.release.package.apexbot-math]
codegen-units = 16
[profile.release.package.apexbot-pools]
codegen-units = 16
[profile.release.package.apexbot-price]
codegen-units = 16
[profile.release.package.apexbot-abi]
codegen-units = 16
[profile.release.package.apexbot-rpc]
codegen-units = 16
[profile.release.package.apexbot-fork]
codegen-units = 16
[profile.release.package.apexbot-bot]
codegen-units = 16
[profile.release.package.apexbot-decoders]
codegen-units = 16
[profile.release.package.apexbot-uniswap]
codegen-units = 16
[profile.release.package.apexbot-pathfinding]
codegen-units = 16
[profile.release.package.apexbot-db]
codegen-units = 16
[profile.release.package.apexbot-executor]
codegen-units = 16
[profile.release.package.apexbot-submission]
codegen-units = 16

# Dev profile (default for `cargo test` / `just dev`): favor representative
# optimization over a fully unoptimized debug build, while keeping iteration
# substantially cheaper than release. No LTO or stripping; line-tables-only
# debug info preserves useful backtraces without the full development DWARF cost.
# This is intentionally opt-level 1: the development extension
# should exercise representative optimized code, and release remains the only
# profile that pays for thin LTO and stripping.
[profile.dev]
# More codegen units for faster incremental dev builds across all crates.
opt-level = 1
# "Relaxed debug-info" (per the comment above, but it was omitted until the
# 422G rust/target incident): line tables keep `RUST_BACKTRACE`, perf, and
# flamegraphs resolving to file:line while dropping the variable/type DWARF
# that bloated every test binary to ~0.5 GiB x hundreds of hash variants.
# Ad-hoc deep debugging a single suite: RUSTFLAGS="-C debuginfo=2 cargo test ...
# (Rust >= 1.71 syntax: "line-tables-only"; older spellings: -C debuginfo=1.)
debug = "line-tables-only"
