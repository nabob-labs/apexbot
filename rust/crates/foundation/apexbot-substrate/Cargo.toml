[package]
name = "apexbot-substrate"
description = "The strategy substrate: BotState (the live state owner), the planning workspace, pool ingress, the connector index, and executor hop views."
keywords = ["mev", "arbitrage", "bot", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5", features = ["full", "transport-throttle"] }
async-trait = { version = "^0.1" }
dashmap = { version = "^6.2" }
hashbrown.workspace = true
indexmap.workspace = true
apexbot-config.workspace = true
apexbot-core.workspace = true
apexbot-db.workspace = true
apexbot-decoders.workspace = true
apexbot-executor.workspace = true
apexbot-ingestion.workspace = true
apexbot-math.workspace = true
apexbot-pathfinding.workspace = true
apexbot-pool-updater.workspace = true
apexbot-pools.workspace = true
apexbot-rpc.workspace = true
apexbot-uniswap.workspace = true
hotpath = { version = "^0.29.0", default-features = false }
parking_lot = { version = "^0.13" }
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
tokio = { version = "^1.54", features = ["rt-multi-thread", "time", "macros", "sync"] }

[dev-dependencies]
proptest = "^1.12"
rusqlite = { version = "^0.40", features = ["bundled"] }
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "fmt", "env-filter", "registry"] }
tokio = { version = "^1.54", features = ["test-util"] }
apexbot-rpc = { workspace = true, features = ["test-utils"] }
