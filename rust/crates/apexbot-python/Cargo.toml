[package]
name = "apexbot_rs"
description = "Rust implementations used by the apexbot Python package."
version.workspace = true
edition.workspace = true
publish = false
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[lib]
name = "apexbot_rs"
crate-type = ["rlib", "cdylib"]

# The PyO3 binding layer (cdylib) over the seven pyo3-free core crates. It is a
# workspace member at `rust/crates/apexbot-python/` (a peer of the cores),
# mirroring `polars-python`'s position in the `polars` workspace. The workspace
# root `rust/Cargo.toml` is a pure virtual manifest. (ergo UG6FKN follow-up:
# ADR-005 deferral — binding layer lifted out of the workspace root.)

[dependencies]
apexbot-config.workspace = true
alloy = { version = "^2.4", features = ["full", "transport-throttle"] }
# Path dependency enables the `pyo3` feature so `From<Error> for PyErr`
# conversions from core are available at this binding layer.
apexbot-rpc = { path = "../apexbot-rpc", optional = true }

apexbot-bot = { path = "../apexbot-bot", optional = true }
# (5WTYYQ) The WS-ingestion event surface the bot-driven pump consumes.
apexbot-ingestion = { path = "../apexbot-ingestion", optional = true }
apexbot-solvers = { path = "../apexbot-solvers", optional = true }
apexbot-pools = { path = "../apexbot-pools" }
apexbot-decoders = { path = "../apexbot-decoders", optional = true }
apexbot-uniswap = { path = "../apexbot-uniswap", optional = true }
apexbot-abi = { path = "../apexbot-abi", optional = true }
apexbot-math = { path = "../apexbot-math", optional = true }
apexbot-db = { path = "../apexbot-db", optional = true }
apexbot-pathfinding = { path = "../apexbot-pathfinding", optional = true }
apexbot-price = { path = "../apexbot-price", optional = true, features = ["pyo3"] }
apexbot-submission = { path = "../apexbot-submission", optional = true, features = ["pyo3"] }
apexbot-simulation = { path = "../apexbot-simulation", optional = true }
apexbot-workers = { path = "../apexbot-workers", optional = true }
revm = { version = "^43.0", default-features = false }
apexbot-arbitrage = { path = "../apexbot-arbitrage", optional = true, features = ["order-index"] }
apexbot-executor = { path = "../apexbot-executor", optional = true }
apexbot-execution = { path = "../apexbot-execution", optional = true }
apexbot-fork = { path = "../apexbot-fork", optional = true }
apexbot-pool-updater = { path = "../apexbot-pool-updater", optional = true }
apexbot-aave = { path = "../apexbot-aave", optional = true }
apexbot-core = { path = "../apexbot-core", features = ["pyo3"] }
dashmap = { version = "^6.2" }
futures-util = { version = "^0.3", default-features = false, features = ["async-await", "std"] }
log = { version = "^0.4" }
lru = { version = "^0.18" }
mimalloc = { version = "0.1", optional = true }
# Engine-slice map type mirrors the core hashbrown maps.
hashbrown.workspace = true
parking_lot = { version = "^0.12" }
pyo3 = { version = "^0.29", features = [ "abi3-py312", "serde", "multiple-pymethods"] }
pyo3-async-runtimes = { version = "^0.29", features = ["tokio-runtime"] }
crossbeam-queue = { version = "^0.3" }
tracing = { version = "^0.1" }
tracing-log = { version = "^0.2" }
tracing-subscriber = { version = "^0.3", default-features = false, features = ["std", "fmt", "ansi", "env-filter", "registry", "alloc"] }
rand = { version = "^0.10" }
serde = { version = "^1.0", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }
tokio = { version = "^1.53", features = ["rt-multi-thread", "time", "macros", "sync"] }
toml = "1.1.6"

[features]
# Per-domain binding-layer features (ergo UG6FKN task UKDOUR). Each gates its optional
# core-crate path dep + the corresponding binding module/mod registrations, mirroring
# how polars gates polars-python with features matching polars-core/-plan/etc.
# Default = all-on (byte-equivalent to the pre-feature surface). Implicit coupling
# (documented in the task completion body): `bot` implies `rpc`+`decoders`+`uniswap`
# (the engine wrapper references apexbot_rpc::provider::AlloyProvider + apexbot_decoders::PoolId
# + apexbot_uniswap::dex_identity directly), and `rpc` implies `abi` (rpc/contract wraps
# crate::abi_types). `async` gates the rpc/ async submodules (no new dep).
# The `apexbot-arbitrage` dep spec carries `features = ["order-index"]`, so
# every `simulation` build (default) gets ADR-024's deterministic profit-
# descending pre-sim selection inside `dispatch_profitable` (B5L2XA).
default = ["auto-initialize", "bot", "rpc", "price", "submission", "simulation", "abi", "concentrated-liquidity-math", "balancer-math", "curve-math", "solidly-math", "v2-math", "uniswap", "pathfinding", "async", "db", "executor", "execution", "pool", "aave-updater", "fork"]
extension-module = ["pyo3/extension-module"]
auto-initialize = ["pyo3/auto-initialize"]
# FF-T1 (BPHR6F): `bot` also names apexbot-workers — the intake seam maps
# the workers' typed BootError family onto the BootRefused exception at
# the pyo3 leaf (the simulation feature already pulled the dep; bot-only
# builds now name the type too).
bot = ["dep:apexbot-bot", "dep:apexbot-ingestion", "dep:apexbot-solvers", "dep:apexbot-workers", "rpc", "decoders", "uniswap"]
price = ["dep:apexbot-price", "rpc"]
submission = ["dep:apexbot-submission", "rpc"]
simulation = ["dep:apexbot-simulation", "dep:apexbot-arbitrage", "dep:apexbot-workers", "rpc", "executor", "submission"]
executor = ["dep:apexbot-executor"]
execution = ["dep:apexbot-execution", "executor"]
fork = ["dep:apexbot-fork"]
rpc = ["dep:apexbot-rpc", "abi"]
abi = ["dep:apexbot-abi"]
concentrated-liquidity-math = ["dep:apexbot-math"]
db = ["dep:apexbot-db"]
pool = ["dep:apexbot-pool-updater", "db", "rpc"]
aave-updater = ["dep:apexbot-aave", "db", "rpc"]
balancer-math = ["dep:apexbot-math"]
curve-math = ["dep:apexbot-math"]
solidly-math = ["dep:apexbot-math"]
v2-math = ["dep:apexbot-math"]
uniswap = ["dep:apexbot-uniswap"]
decoders = ["dep:apexbot-decoders"]
pathfinding = ["dep:apexbot-pathfinding"]
async = []
# mimalloc fixes OOM under bursty allocation vs. the default system allocator.
# local_dynamic_tls is REQUIRED: its default initial-exec TLS model must fit in
# glibc's ~1664-byte static TLS surplus at dlopen() time, which fails whenever
# any other extension module (e.g. pytest) is imported first —
# "ImportError: cannot allocate memory in static TLS block". The dynamic
# TLS model routes the per-thread heaps through the DTV instead. Do not drop
# this feature unless the initial-exec relocation count of _ffi.abi3.so
# (readelf -rW .../abi3.so | grep -c TPOFF64) is verifiably still zero.
mimalloc = ["dep:mimalloc", "mimalloc/local_dynamic_tls"]
# OTel span export for the Python-driven path (K6PCKP): pulls apexbot-bot
# with its `otel` feature (OTLP exporter + layer). NOT in `default` -
# release/CI wheels must not ship the OTLP client footprint (same
# exclusion story as hotpath; pyproject [tool.maturin] dev builds enable it).
otel = ['bot', 'apexbot-bot/otel']

[dev-dependencies]
ctor = "^1"
proptest = "^1.11"
# Enable test-only constructors (e.g. `AlloyProvider::from_provider`) for
# the root crate's tests. Production builds pull apexbot-rpc without this
# feature.
apexbot-rpc = { path = "../apexbot-rpc", features = ["test-utils"] }

# Seam-C test seam: InMemorySpanExporter (K6PCKP). Same version lock as
# apexbot-bot (tracing-opentelemetry 0.33 <-> opentelemetry(-sdk) 0.32).
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["trace", "testing"] }

[[test]]
name = "python_integration"
required-features = ["auto-initialize"]

[[test]]
name = "concurrency_stress"
required-features = ["auto-initialize"]
