[package]
name = "apexbot-pool-updater"
description = "Pure-Rust pool-updater chunk-loop core: typed RPC event fetching + decode-to-row-input mapping (epic 2SFL6I)."
keywords = ["mev", "pools", "events", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.4" }
apexbot-db.workspace = true
# Tick-map types from apexbot-db are hashbrown maps.
hashbrown.workspace = true
apexbot-decoders.workspace = true
apexbot-core.workspace = true
apexbot-rpc.workspace = true
tokio = { version = "^1.53", features = ["rt-multi-thread", "macros", "sync"] }
thiserror = { version = "^2.0" }
tracing = { version = "^0.1" }
# Plain rusqlite (no `bundled`) — the bundled libsqlite3-sys link is owned
# solely by apexbot-db; here we only need the Connection/Transaction types.
rusqlite = { version = "^0.40" }

[features]
default = []

[dev-dependencies]
alloy = { version = "^2.4" }
apexbot-rpc.workspace = true
tempfile = { version = "^3.27" }
