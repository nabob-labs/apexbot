[package]
name = "apexbot-execution"
description = "The ExecutionAdapter seam (ADR-025) — a pyo3-free crate owning the user-owned execution layer: the ExecutionAdapter trait + its value types (solve-result view, gate protocol, ExecutionResult, ComposerInputs) and the PayloadComposer Encode part. No default strategy ships here."
keywords = ["mev", "execution", "evm", "transactions"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
alloy = { version = "^2.5" }
thiserror = { version = "^2.0" }
# `PathInfo` (hop descriptors) — the solve-result view's hop side (ADR-025 D4).
# `apexbot-executor` is the developer's `cmd_executor` adapter, NOT a general
# execution layer; this crate only borrows its `PathInfo`/`HopInfo` descriptor
# types so the seam's Encode input (`path: &PathInfo`) matches what a Rust
# consumer already reaches.
apexbot-executor.workspace = true
# `SolvePathResult` (amounts) — the solve-result view's amount side (ADR-025 D4).
apexbot-pools.workspace = true
