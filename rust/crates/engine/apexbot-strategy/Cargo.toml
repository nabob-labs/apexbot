[package]
name = "apexbot-strategy"
description = "The strategy plane: the six-slot Strategy vocabulary and the concrete executable strategies composed over the capability crates (execution adapter seam + submission surface). pyo3-free."
keywords = ["mev", "strategy", "arbitrage", "evm"]
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
authors.workspace = true

[lints]
workspace = true

[dependencies]
apexbot-core.workspace = true
apexbot-execution.workspace = true
apexbot-submission.workspace = true
apexbot-substrate.workspace = true
apexbot-pathfinding.workspace = true
apexbot-pools.workspace = true
apexbot-simulation.workspace = true
apexbot-rpc.workspace = true
apexbot-decoders.workspace = true
apexbot-db.workspace = true
apexbot-config.workspace = true
apexbot-eventhub.workspace = true
apexbot-runs = { workspace = true, features = ["tracing"] }
apexbot-math.workspace = true
apexbot-executor.workspace = true
alloy = { version = "^2.5", features = ["full", "transport-throttle"] }
hashbrown.workspace = true
parking_lot = "^0.13"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "^1.0" }
thiserror = { version = "^2.0" }
tokio = { version = "^1.54", features = ["rt-multi-thread", "sync", "time", "macros"] }
tracing = { version = "^0.1" }

[dev-dependencies]
async-trait = "0.1"
apexbot-rpc = { workspace = true, features = ["test-utils"] }
proptest = "^1.12"
revm = { version = "^43.0", default-features = false, features = ["std"] }
tempfile = { version = "^3.27" }
